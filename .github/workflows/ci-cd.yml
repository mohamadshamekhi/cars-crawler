name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # همان نسخه‌ی Dockerfile (python:3.12-slim)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      # فقط قوانین بحرانی؛ app.py عمداً load_dotenv را قبل از importها صدا می‌زند (E402)
      - name: Lint (critical rules)
        run: |
          pip install ruff==0.8.4
          ruff check --select E9,F63,F7,F82 --output-format github .

      - name: Import smoke test (no browser)
        env:
          CARS_API_BASE_URL: http://127.0.0.1:3000
          CRAWLER_API_KEY: ci
        run: python -c "import app; assert app.app.title; print('app import ok')"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crawler:ci
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,scope=crawler,mode=max

  deploy:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-crawler
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          # git/build/health همه داخل deploy.sh انجام می‌شود
          script: cd ~/khodroban/crwoler && ./deploy.sh
